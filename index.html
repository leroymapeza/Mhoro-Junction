function ac(){

  if(A){try{AC=new A();master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);}catch(e){AC=null;}}}

 try{var out=master?master:a.destination;
 var o=a.createOscillator(),g=a.createGain();o.type=tp||'sine';o.frequency.value=f;
 if(sl){o.frequency.linearRampToValueAtTime(sl,a.currentTime+d);}
 g.gain.value=v||.2;g.gain.linearRampToValueAtTime(.0001,a.currentTime+d);
 o.connect(g);g.connect(out);o.start();o.stop(a.currentTime+d);}catch(e){}}

  for(var i=0;i<ch.length;i++){ch[i]=Math.random()*2-1;}}

function ez(a,b,v){var k=Math.max(0,Math.min(1,(v-a)/(b-a)));return k*k*(3-2*k);}
function lp(a,b,k){return a+(b-a)*k;}

function computeTotal(){pathTotal=0;for(var i=1;i<path.length;i++){pathTotal+=Math.hypot(path[i].x-path[i-1].x,path[i].y-path[i-1].y);}}
function samplePath(d){if(path.length<2){return{x:640,y:560};}var acc=0;
 for(var i=1;i<path.length;i++){var a=path[i-1],b=path[i],L=Math.hypot(b.x-a.x,b.y-a.y);
 if(acc+L>=d){var k=L?(d-acc)/L:0;return{x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k};}acc+=L;}return path[path.length-1];}

  if(!fk.drop){fk.drop={x:fk.cx,y:300};}return;}
 if(state==='lullaby'){if(id==='back'){state='hub';return;}
  if(id&&id[0]==='s'&&lu.phase==='input'){var si=+id[1];lu.flash=si;kal(LU_FREQ[si]);
   if(lu.seq[lu.idx]===si){lu.idx++;
    if(lu.idx>=lu.seq.length){lu.round++;sCheer();pop(640,260,'YAY!',C.green,50);lu.seq.push(ri(8));lu.phase='show';lu.showI=0;lu.t=1;}}
   else{sGiggle();lu.phase='show';lu.showI=0;lu.t=1;}}
  return;}
 if(state==='cloud'){if(id==='back'){state='hub';return;}
  if(id&&id[0]==='c'){cl.drag=+id[1];}return;}
 if(state==='count'){if(id==='back'){state='hub';return;}
  if(id&&id[0]==='l'){var li=+id[1];
   if(cn.ns[li]===cn.target){sCheer();confetti(300+li*340,500,20);pop(300+li*340,440,'ZVAKANAKA!',C.green,50);
    setTimeout(function(){if(state==='count'){resetCount();}},1200);}
   else{sGiggle();addShake(5);pop(300+li*340,440,'COUNT AGAIN!',C.purple,36);}}
  return;}
 if(state==='memory'){if(id==='back'){state='hub';return;}
  if(id&&id[0]==='k'&&me.lock<=0){var ki=+id[1];var cd=me.cards[ki];
   if(!cd.fl&&!cd.ma){cd.fl=true;sPop();
    if(me.first<0){me.first=ki;}
    else{var o=me.cards[me.first];
     if(o.col===cd.col){o.ma=true;cd.ma=true;me.first=-1;sCheer();
      var done=true;for(var x=0;x<6;x++){if(!me.cards[x].ma){done=false;}}
      if(done){confetti(640,360,40);pop(640,300,'MAKOROKOTO!',C.orange,60);
       setTimeout(function(){if(state==='memory'){resetMemory();}},1500);}}
     else{me.a=me.first;me.b=ki;me.lock=.8;sGiggle();}}}}
  return;}
 if(state==='feed'){if(id==='back'){state='hub';return;}
  if(id&&id[0]==='f'){holdFruit=+id[1];sPop();return;}
  if(holdFruit>=0){for(var q=0;q<pips.length;q++){var qp=pips[q];
   if(Math.hypot(p.x-qp.x,p.y-qp.y)<85&&qp.hunger<3&&qp.flip<=0){
    qp.hunger++;qp.lastFed=t;qp.chomp=.6;qp.squash=.35;qp.mouth=0;sChomp();setTimeout(sGulp,120);
    pop(qp.x,qp.y-70,'CHOMP!',C.purple,34);addShake(4);
    puff(qp.x,qp.y-40,'#F27E6B',4,'heart');holdFruit=-1;return;}}}
  return;}
 if(state==='play'){
  if(helpOpen){helpOpen=false;return;}
  if(lesson){if(id==='next'){if(level<LEVELS.length-1){startLevel(level+1);}
   else{state='win';sCheer();confetti(640,150,80);}}return;}
  if(id==='back'){state='hub';return;}
  if(id==='help'){helpOpen=true;return;}
  if(id==='go'){go();return;}
  if(id==='bridge'){if(inv.bridge>0){placing='bridge';say('Now tap the blue stream!');}else{say('No bridges left - melon time!');}return;}
  if(id==='melon'){if(inv.melon>0){placing='melon';}else{say('No melons left!');}return;}
  if(placing==='bridge'){if(inStream(p.x,p.y)){bridges.push({x:p.x,y:p.y});inv.bridge--;placing=null;sKlonk();
   addShake(5);pop(p.x,p.y-40,'KLONK!',C.trunk,36);puff(p.x,p.y,C.trunk,5,'dust');say('Bridge built! Tap GO!');}
   else{say('Put the bridge on the blue stream.');}return;}
  if(placing==='melon'){if(p.y>450){melons.push({x:p.x,y:p.y});inv.melon--;placing=null;sPop();
   pop(p.x,p.y-40,'POP!',C.green,30);puff(p.x,p.y,C.green,5,'dust');}return;}
  if(p.y>440){drawing=true;path=[p];
   for(var r2=0;r2<pips.length;r2++){var qp2=pips[r2];if(qp2.st!=='splash'){qp2.st='wait';qp2.x=qp2.sx;qp2.y=qp2.sy;qp2.rot=0;}}}
  return;}
 if(state==='btrace'){if(id==='back'){state='hub';return;}
  if(!bt.flying&&p.y>430){drawing=true;path=[p];}
  return;}
});
addEventListener('pointerup',function(){
 if(state==='snatch'){sn.hold=false;}
 if(state==='bath'){ba.down=false;}
 if(state==='cloud'){cl.drag=-1;}
 if(state==='dress'&&dr.drag!==null){for(var i=0;i<3;i++){var q=dr.ps[i];
  if(Math.hypot(ptrPos.x-q.x,ptrPos.y-560)<80&&q.s===null){q.s=dr.drag;sPop();star(q.x,520,12,C.yellow);pop(q.x,500,'FAB!',C.purple,34);}}
  dr.drag=null;}
 drawing=false;
 if(state==='btrace'&&!bt.flying){if(path.length>5){computeTotal();bt.flying=true;bt.fly=0;bt.fx=200;bt.fy=560;sWhoosh();}else{path=[];}}
 else if(path.length<5&&state==='play'){path=[];}});

<script>
(function(){
 var b=document.getElementById('fsbtn'),h=document.getElementById('fshelp'),c=document.getElementById('fsclose');
 function isFs(){return document.fullscreenElement||document.webkitFullscreenElement;}
 function enter(){var el=document.documentElement;
  if(el.requestFullscreen){el.requestFullscreen().catch(function(){h.style.display='block';});}
  else if(el.webkitRequestFullscreen){el.webkitRequestFullscreen();}
  else{h.style.display='block';}}
 function exitFs(){if(document.exitFullscreen){document.exitFullscreen();}else if(document.webkitExitFullscreen){document.webkitExitFullscreen();}}
 b.addEventListener('click',function(e){e.stopPropagation();
  if(isFs()){exitFs();}else{enter();}
  if(screen.orientation&&screen.orientation.lock){screen.orientation.lock('landscape').catch(function(){});}});
 c.addEventListener('click',function(){h.style.display='none';});
 setInterval(function(){
  var s=(typeof state!=='undefined')?state:'';
  b.style.display=(s==='title'||s==='hub'||s==='more')?'block':'none';
 },300);
})();
</script>
